<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAir.ai™</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
    <!-- Navbar with wing logo + TM -->
    <nav class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="wing-logo"></div>
                <div class="font-semibold text-3xl tracking-[-1.2px]">TravelAir<span class="text-amber-400 font-bold">.ai</span><span class="text-xs align-super ml-0.5">™</span></div>
            </div>
            <!-- Menu -->
            <div class="hidden lg:flex items-center gap-x-8 text-sm font-medium">
                <a href="#" class="hover:text-amber-400">Home</a>
                <a href="#" class="hover:text-amber-400">Trips</a>
                <a href="#" class="hover:text-amber-400">Flights</a>
                <a href="#" class="hover:text-amber-400">Hotels</a>
                <a href="#" class="hover:text-amber-400">Cruises</a>
                <a href="#" class="hover:text-amber-400">Cars</a>
                <a href="#" class="hover:text-amber-400">Experiences</a>
                <a href="#" class="hover:text-amber-400">Deals</a>
                <a href="#" class="hover:text-amber-400">About</a>
            </div>
            <div class="flex items-center gap-x-3">
                <button onclick="showSignInModal()" class="px-6 py-2.5 text-sm font-medium border border-zinc-700 hover:bg-zinc-900 rounded-full">Sign In</button>
                <button onclick="document.getElementById('founding-section').scrollIntoView({behavior:'smooth'})" class="px-7 py-2.5 text-sm font-semibold bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 rounded-full">Join Free — It's Free to Plan</button>
            </div>
        </div>
    </nav>

    <!-- Hero with Three.js Globe -->
    <div class="hero-bg min-h-[92vh] relative flex items-center">
        <canvas id="globe-canvas" class="absolute inset-0"></canvas>
        <div class="max-w-screen-2xl mx-auto px-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
            <!-- Left content -->
            <div class="lg:col-span-7">
                <div class="inline-flex items-center gap-x-2 bg-zinc-900/70 px-5 py-1.5 rounded-full mb-8">100% FREE TO PLAN</div>
                <h1 class="heading text-6xl lg:text-7xl leading-none tracking-[-3px]">The Future of<br><span class="gold-gradient">Travel Starts Here</span></h1>
                <p class="max-w-lg text-[17px] text-zinc-300">AI trip planning for flights, hotels, cruises, private jets, cars, yachts &amp; more. One conversation. One itinerary. Completely free.</p>
                <!-- Search -->
                <div class="mt-8 max-w-md">
                    <div class="relative">
                        <input id="hero-search" type="text" placeholder="Where do you want to go?" class="w-full bg-zinc-900 border border-zinc-700 focus:border-amber-400 pl-14 pr-16 py-4 rounded-3xl text-lg placeholder:text-zinc-500 outline-none">
                        <button onclick="triggerSearch()" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-11 h-11 bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 rounded-2xl flex items-center justify-center">→</button>
                    </div>
                </div>
            </div>
            <!-- Chat -->
            <div class="lg:col-span-5">
                <div class="ai-chat-panel rounded-3xl overflow-hidden">
                    <div id="chat-messages" class="h-[305px] p-5 space-y-4 overflow-y-auto bg-zinc-950 text-sm"></div>
                    <div class="p-4 bg-zinc-900 border-t border-zinc-800">
                        <input id="chat-input" type="text" placeholder="Ask me anything..." class="w-full bg-zinc-950 border border-zinc-700 focus:border-amber-400 px-5 py-3 rounded-2xl text-sm outline-none" onkeypress="if(event.key==='Enter') sendChatMessage()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats, Destinations, Features, Founding Formspree CTA, Footer -->
    <!-- Add full sections from screenshot here -->

    <script src="script.js"></script>
</body>
</html>
