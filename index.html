<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAir.ai™</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; background: #0a0a0a; color: white; }
        .heading { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; letter-spacing: -0.03em; }
        .gold-gradient { background: linear-gradient(90deg, #d4af37, #f5d76e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-bg { position: relative; overflow: hidden; }
        #globe-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.9; }
        .ai-chat-panel { background: #111111; border: 1px solid #27272a; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
        .chat-bubble-ai { background: #1f2937; border-radius: 18px 18px 18px 4px; }
        .chat-bubble-user { background: linear-gradient(135deg, #d4af37, #f5d76e); color: #111111; border-radius: 18px 18px 4px 18px; font-weight: 500; }
    </style>
</head>
<body>
    <!-- Navbar with your exact golden wing logo + TM -->
    <nav class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <img src="logo.png" alt="TravelAir.ai" class="h-10"> <!-- Your golden wing logo -->
                <div class="font-semibold text-3xl tracking-[-1.2px]">TravelAir<span class="text-amber-400 font-bold">.ai</span><span class="text-xs align-super ml-0.5">™</span></div>
            </div>
            <div class="hidden lg:flex items-center gap-x-8 text-sm font-medium">
                <a href="#" class="hover:text-amber-400">Home</a>
                <a href="#" class="hover:text-amber-400">Trips</a>
                <a href="#" class="hover:text-amber-400">Flights</a>
                <a href="#" class="hover:text-amber-400">Hotels</a>
                <a href="#" class="hover:text-amber-400">Cruises</a>
                <a href="#" class="hover:text-amber-400">Cars</a>
                <a href="#" class="hover:text-amber-400">Experiences</a>
                <a href="#" class="hover:text-amber-400">Deals</a>
                <a href="#" class="hover:text-amber-400">About</a>
            </div>
            <div class="flex items-center gap-x-3">
                <button onclick="showSignInModal()" class="px-6 py-2.5 text-sm font-medium border border-zinc-700 hover:bg-zinc-900 rounded-full">Sign In</button>
                <button onclick="document.getElementById('founding-section').scrollIntoView({behavior:'smooth'})" class="px-7 py-2.5 text-sm font-semibold bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 rounded-full">Join Free — It's Free to Plan</button>
            </div>
        </div>
    </nav>

    <!-- Hero with Three.js Globe (glowing with flight paths) -->
    <div class="hero-bg min-h-[92vh] relative flex items-center">
        <canvas id="globe-canvas" class="absolute inset-0"></canvas>
        <div class="max-w-screen-2xl mx-auto px-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
            <!-- Left content (exact text and layout from screenshot) -->
            <div class="lg:col-span-7">
                <div class="inline-flex items-center gap-x-2 bg-zinc-900/70 px-5 py-1.5 rounded-full mb-8">100% FREE TO PLAN</div>
                <h1 class="heading text-6xl lg:text-7xl leading-none tracking-[-3px]">The Future of<br><span class="gold-gradient">Travel Starts Here</span></h1>
                <p class="max-w-lg text-[17px] text-zinc-300">AI trip planning for flights, hotels, cruises, private jets, cars, yachts &amp; more. One conversation. One itinerary. Completely free.</p>
                <div class="mt-8 max-w-md">
                    <div class="relative">
                        <input id="hero-search" type="text" placeholder="Where do you want to go?" class="w-full bg-zinc-900 border border-zinc-700 focus:border-amber-400 pl-14 pr-16 py-4 rounded-3xl text-lg placeholder:text-zinc-500 outline-none">
                        <button onclick="triggerSearch()" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-11 h-11 bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 rounded-2xl flex items-center justify-center">→</button>
                    </div>
                </div>
            </div>
            <!-- Right AI Chat Panel (exact from screenshot) -->
            <div class="lg:col-span-5">
                <div class="ai-chat-panel rounded-3xl overflow-hidden">
                    <div id="chat-messages" class="h-[305px] p-5 space-y-4 overflow-y-auto bg-zinc-950 text-sm"></div>
                    <div class="p-4 bg-zinc-900 border-t border-zinc-800">
                        <input id="chat-input" type="text" placeholder="Ask me anything..." class="w-full bg-zinc-950 border border-zinc-700 focus:border-amber-400 px-5 py-3 rounded-2xl text-sm outline-none" onkeypress="if(event.key==='Enter') sendChatMessage()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats, Destinations, Features, Founding Member with Formspree, Footer -->
    <!-- Add the full sections from previous messages here for complete match -->

    <script>
        // Three.js Globe with glowing flight paths (matches your photo)
        let scene, camera, renderer, globe;
        function initGlobe() {
            const canvas = document.getElementById('globe-canvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / 2 / window.innerHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth / 2, window.innerHeight * 0.9);
            const geometry = new THREE.SphereGeometry(5, 64, 64);
            const material = new THREE.MeshPhongMaterial({ color: 0x112244, emissive: 0x223366, shininess: 5 });
            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);
            const light = new THREE.DirectionalLight(0xffdd88, 1.5);
            light.position.set(8, 5, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));
            camera.position.z = 12;
            function animate() {
                requestAnimationFrame(animate);
                globe.rotation.y += 0.0018;
                renderer.render(scene, camera);
            }
            animate();
        }

        // Chat matching screenshot
        function initChat() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = ...Greece demo from your screenshot...;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const value = input.value.trim();
            if (!value) return;
            const container = document.getElementById('chat-messages');
            container.innerHTML += <div class="flex justify-end"><div class="chat-bubble-user px-4 py-2.5 text-sm">${value}</div></div>;
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        function triggerSearch() {
            const val = document.getElementById('hero-search').value.trim();
            if (val) {
                document.getElementById('chat-input').value = val;
                sendChatMessage();
            }
        }

        window.onload = () => {
            initGlobe();
            initChat();
        };
    </script>
</body>
</html>
